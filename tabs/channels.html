<!-- tabs/channels.html -->
<section class="section" id="section-channels">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 24px;">
        <div>
            <h1 class="page-title">Network Architecture</h1>
            <p class="page-subtitle">Configure and monitor frequency allocation and waveform profiles</p>
        </div>
        <div class="header-stats" style="display:flex; gap: 20px;">
            <div class="stat-item">
                <span class="stat-label">TOTAL NETS</span>
                <span class="stat-value" id="stat-total-nets">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ACTIVE USERS</span>
                <span class="stat-value" id="stat-total-users">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label" style="color:var(--gn)">HEALTH</span>
                <span class="stat-value" style="color:var(--gn)">100%</span>
            </div>
        </div>
    </div>

    <div class="filter-bar" style="display:flex; gap:12px; margin-bottom:24px; background:rgba(255,255,255,0.03); padding:16px; border-radius:12px; border:1px solid var(--border-color);">
        <div style="flex:1; position:relative;">
            <input type="text" id="ch-search" placeholder="Search by net name, frequency, or waveform..." 
                   oninput="renderChannelsFull()"
                   style="width:100%; padding:10px 16px 10px 40px; background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:8px; color:white;">
            <svg style="position:absolute; left:12px; top:11px; width:18px; height:18px; opacity:0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <button class="btn amber" onclick="openChannelModal(null)" style="padding:0 24px; height:42px;">+ Create New Net</button>
    </div>

    <div id="ch-grid" class="channel-grid">
        <!-- Cards injected by renderChannelsFull() -->
        <div class="empty-state" style="padding:100px; grid-column: 1 / -1;">Initializing Network Controller...</div>
    </div>

    <style>
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: right;
        }
        .stat-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 24px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .net-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .net-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
            background: rgba(255,255,255,0.04);
        }
        .net-card.active {
            border-color: var(--gn);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.1);
        }

        .net-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .net-id {
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }
        .net-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .net-visual {
            height: 40px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 0 10px;
        }
        .v-bar {
            width: 3px;
            background: var(--gn);
            opacity: 0.3;
            border-radius: 1px;
        }
        .net-card.active .v-bar {
            animation: v-pulse 1.2s infinite ease-in-out;
        }
        @keyframes v-pulse {
            0%, 100% { height: 10%; opacity: 0.2; }
            50% { height: 70%; opacity: 0.8; }
        }

        .net-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        .meta-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .meta-value {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .net-roster {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .roster-pill {
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        .roster-pill.online {
            color: var(--gn);
            border-color: rgba(76, 175, 80, 0.2);
            background: rgba(76, 175, 80, 0.05);
        }
        .roster-pill.talking {
            background: var(--success-bg);
            border-color: var(--gn);
            color: var(--gn);
            animation: pulse-border 1.5s infinite;
        }

        .net-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
    </style>

    <script>
        (async () => {
            if (typeof renderChannelsFull === 'function') renderChannelsFull();
        })();
    </script>
</section>
