<!-- tabs/profiles.html -->
<section class="section" id="section-profiles">
    <div class="page-header">
        <div>
            <h1 class="page-title">Radio Hardware Profiles</h1>
            <p class="page-subtitle">Define physical properties for different types of radio equipment</p>
        </div>
        <div class="help-trigger" onclick="showQuickHelp('profiles')">
            <span>❓</span> Help
        </div>
    </div>
    <div class="card-actions" style="margin-bottom:24px">
        <button class="btn btn-sm" onclick="profilesRefresh()">Refresh System</button>
        <button class="btn btn-sm amber" onclick="openProfileModal(null)">+ Create Hardware Profile</button>
    </div>

    <div id="profiles-container">
        <!-- Rendered by renderProfilesFull() -->
        <div class="profiles-grid" id="profiles-grid">
            <div class="empty-state">Initalizing hardware registry...</div>
        </div>
    </div>

    <style>
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .hw-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hw-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 30px rgba(0, 184, 212, 0.15);
            transform: translateY(-2px);
        }

        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hw-title-group {
            display: flex;
            flex-direction: column;
        }

        .hw-model {
            font-size: 10px;
            color: var(--accent-blue);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hw-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 2px;
        }

        .hw-badge-list {
            display: flex;
            gap: 6px;
        }

        .hw-spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .hw-spec-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hw-spec-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .hw-spec-value {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .hw-power-meter {
            margin-top: 4px;
        }

        .meter-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .hw-features {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: auto;
        }

        .feat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .feat-pill.active {
            color: var(--gn);
        }

        .feat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .feat-pill.active .feat-dot {
            box-shadow: 0 0 6px currentColor;
        }

        .hw-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 8px;
        }
    </style>
    <script>
        (async () => {
            if (typeof profilesRefresh === 'function') profilesRefresh();
        })();
    </script>
</section>
