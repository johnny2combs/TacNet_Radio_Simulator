<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TacNet Radio Stream Deck Plugin</title>
</head>
<body>
    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            var errInfo = {
                message: msg,
                url: url,
                line: lineNo,
                column: columnNo,
                stack: error ? error.stack : ""
            };
            fetch("http://127.0.0.1:8895/api/log", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(errInfo)
            }).catch(function(e) {});
            return false;
        };
    </script>
    <script src="plugin.js"></script>
</body>
</html>
